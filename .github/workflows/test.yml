on: [push, pull_request]

name: Continuous integration

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      # Resolve dependencies to versions that support the rust-version in Cargo.toml.
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    strategy:
      matrix:
        rust:
          - stable
          - 1.88.0
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all --all-features

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          # - 1.88.0
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          # With all features, so that the tests of the web framework
          # features (test_warp, test_axum) run too.
          args: --all --all-features
